name: Blue/Green CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: sofiikam/hello-bluegreen
  GKE_CLUSTER: bluegreen-cluster
  GKE_LOCATION: us-central1

jobs:
  ci:
    name: Test, build & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt pytest

      - name: Run unit tests
        working-directory: app
        run: pytest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  cd:
    name: Blue/green deploy to GKE
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write                      # allows pushing the manifest commit
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}

      - name: Work out which colour is live
        run: |
          ACTIVE=$(kubectl get service hello -o jsonpath='{.spec.selector.color}' 2>/dev/null || true)
          if [ "$ACTIVE" = "blue" ]; then NEW=green; else NEW=blue; fi
          echo "Live: ${ACTIVE:-none} -> deploying to: $NEW"
          echo "ACTIVE=$ACTIVE" >> "$GITHUB_ENV"
          echo "NEW=$NEW" >> "$GITHUB_ENV"

      - name: Deploy new version to the idle colour
        run: |
          sed -i "s|image: .*|image: $IMAGE:$GITHUB_SHA|" k8s/deployment-$NEW.yaml
          sed -i "s|replicas: .*|replicas: 2|" k8s/deployment-$NEW.yaml
          kubectl apply -f k8s/deployment-$NEW.yaml
          kubectl rollout status deployment/hello-$NEW --timeout=600s

      - name: Smoke test the new colour (before it gets traffic)
        run: |
          kubectl port-forward deployment/hello-$NEW 8050:8050 &
          sleep 5
          curl --fail --silent --show-error http://localhost:8050/

      - name: Switch traffic to the new colour
        run: |
          sed -i "s|color: .*|color: $NEW|" k8s/service.yaml
          kubectl apply -f k8s/service.yaml

      - name: Scale down the old colour
        if: env.ACTIVE != ''
        run: |
          kubectl scale deployment/hello-$ACTIVE --replicas=0
          sed -i "s|replicas: .*|replicas: 0|" k8s/deployment-$ACTIVE.yaml

      - name: Commit updated manifests to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git commit -m "Deploy ${GITHUB_SHA::7} to $NEW [skip ci]"
          git push
