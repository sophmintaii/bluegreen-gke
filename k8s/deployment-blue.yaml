apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-blue
  labels:
    app: hello
    color: blue
spec:
  replicas: 0
  selector:
    matchLabels:
      app: hello
      color: blue
  template:
    metadata:
      labels:
        app: hello
        color: blue
    spec:
      containers:
        - name: hello
          image: sofiikam/hello-bluegreen:8b39b59d6bd18549b130da9419db4ca78dec6461
          ports:
            - name: http
              containerPort: 8050
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
