apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-green
  labels:
    app: hello
    color: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: hello
      color: green
  template:
    metadata:
      labels:
        app: hello
        color: green
    spec:
      containers:
        - name: hello
          image: REPLACED_BY_CI
          ports:
            - name: http
              containerPort: 8050
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
